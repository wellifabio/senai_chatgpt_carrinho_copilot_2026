<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete de Lanche</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lanchonete de Lanche</h1>
        <button id="btnCarrinho">Carrinho</button>
    </header>
    <main></main>

    <div id="modalCarrinho" class="modal oculto">
        <div class="modal-conteudo">
            <h2>Seu Carrinho</h2>
            <ul id="listaCarrinho"></ul>
            <p id="totalGeralCarrinho">Total: R$ 0,00</p>
            <div class="modal-acoes">
                <button id="btnFecharModal" class="btn-secundario">Fechar</button>
                <button id="btnEnviarPedido" class="btn-primario">Enviar pedido</button>
            </div>
        </div>
    </div>

    <footer>
        <h2>
            by wellifabio
        </h2>
    </footer>
    <script src="script.js"></script>
